name: omnicare
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.5.1
  device_frame: ^1.4.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  fl_chart: ^1.1.1
  animated_flip_counter: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.11

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/appIcon_.png"
  web:
    generate: true
    image_path: "assets/icons/appIcon_.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/splashImg.png"
  android: true
  web: false
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/organs/colored/
    - assets/images/organs/grey/
    - assets/icons/




